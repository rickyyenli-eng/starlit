<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starlit 星曜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;700&display=swap">
<style>
/* Layout: one reading column — birth form, then two tabs (星盤 / 紫微); each tab = summary strip → chart + explanation panel side by side → full table */
:root{
  --bg:#EDF0F5; --panel:#FFFFFF; --sunk:#F5F7FA; --ink:#1B2136; --muted:#5A6177; --line:#D3D9E3;
  --accent:#2C47A3; --accent-soft:#E2E8F7; --seal:#B23D2C; --seal-soft:#F6E3DF;
  --good:#2C7A57; --good-soft:#DFF0E7; --hold:#A0681E; --hold-soft:#F5EAD6;
  --fire:#C4532F; --earth:#8C6B26; --air:#2F7EA6; --water:#4A4FB0;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1220; --panel:#171B2C; --ink:#E5E8F1; --muted:#9BA2B8; --line:#2B3149;
  --accent:#93A8F2; --accent-soft:#222C52; --seal:#E5735F; --seal-soft:#3A2220;
  --good:#6CCB9D; --good-soft:#1C3329; --hold:#E0AA5C; --hold-soft:#3A2D19;
  --fire:#EE8460; --earth:#D1AE63; --air:#6EB8DE; --water:#9EA3F2; color-scheme:dark; --sunk:#131727; }}
:root[data-theme="dark"]{
  --bg:#0F1220; --panel:#171B2C; --sunk:#131727; --ink:#E5E8F1; --muted:#9BA2B8; --line:#2B3149;
  --accent:#93A8F2; --accent-soft:#222C52; --seal:#E5735F; --seal-soft:#3A2220;
  --good:#6CCB9D; --good-soft:#1C3329; --hold:#E0AA5C; --hold-soft:#3A2D19;
  --fire:#EE8460; --earth:#D1AE63; --air:#6EB8DE; --water:#9EA3F2; color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding:0 16px;}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(28px,5vw,40px);letter-spacing:.04em}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}


/* form */
form.birth{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 16px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-size:13px;color:var(--muted);font-weight:500}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,.cell:focus-visible,.pl:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px 0;cursor:pointer;color:var(--ink);font-size:15px;background:var(--sunk)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked+span{color:var(--accent);font-weight:700}
.seg label:has(input:checked){background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);grid-column:1/-1}
.check input{width:auto;margin-top:5px}
details.adv{grid-column:1/-1;font-size:13px;color:var(--muted)}
details.adv summary{cursor:pointer;width:max-content}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--panel);border:0;border-radius:8px;padding:10px 18px;cursor:pointer;letter-spacing:.1em}
button.go:hover{filter:brightness(1.08)}
.notice{font-size:13px;padding:10px 14px;border-radius:8px;background:var(--hold-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--hold) 35%,transparent)}
.notice[hidden]{display:none}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-family:var(--f-display);font-size:18px;font-weight:700;background:none;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
section.pane{display:flex;flex-direction:column;gap:20px}

/* primer */
.primer{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.primer div{padding:12px 14px;border-left:3px solid var(--line);min-width:0}
.primer b{font-family:var(--f-display);font-size:16px;display:block}
.primer span{font-size:13.5px;color:var(--muted)}

/* summary */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .big{font-family:var(--f-display);font-size:24px;font-weight:700}
.card .q{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.card p{font-size:14px;color:var(--muted)}

/* main split */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:0}
@media (max-width:860px){.detail{position:static}}
.detail .hint{font-size:13px;color:var(--muted)}
.say{font-size:16px;line-height:1.85}
.say strong{color:var(--accent)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--seal-soft);color:var(--seal);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.hold{background:var(--hold-soft);color:var(--hold);border-color:transparent}
.block{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px dashed var(--line)}
.block h4{margin:0;font-size:14px;font-family:var(--f-body);font-weight:700}
.block p{font-size:14.5px}
.pros{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:14px}
.pros .t{font-weight:700}
.pros .t.g{color:var(--good)} .pros .t.w{color:var(--seal)}

/* wheel */
svg.wheel{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}
.wheel text{font-family:var(--f-body)}
.pl{cursor:pointer}
.pl circle.bg{fill:var(--panel);stroke:var(--line);stroke-width:1}
.pl:hover circle.bg,.pl.on circle.bg{stroke:var(--accent);stroke-width:2;fill:var(--accent-soft)}
.pl text{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:8px 6px 2px;justify-content:center}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}

/* tables */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.06em;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
td.p{font-family:var(--f-display);font-weight:700;white-space:nowrap}

/* element bars */
.elem{display:flex;flex-direction:column;gap:6px}
.erow{display:grid;grid-template-columns:2.2em 1fr 1.5em;gap:8px;align-items:center;font-size:13.5px}
.ebar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.ebar span{display:block;height:100%}

/* zi wei grid */
.zw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(118px,auto));gap:4px}
.cell{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 7px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0;position:relative}
.cell:hover{border-color:var(--accent)}
.cell.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell.ming{background:var(--accent-soft)}
.cell.dec::after{content:"";position:absolute;inset:0;border-radius:6px;border:2px dashed var(--hold);pointer-events:none}
.cell .stars{display:flex;flex-wrap:wrap;gap:0 6px;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.35}
.cell .stars span{white-space:nowrap}
.cell sup{font-family:var(--f-body);font-weight:400;font-size:10px;color:var(--muted);margin-left:1px}
.mut{display:inline-block;font-family:var(--f-body);font-size:10.5px;font-weight:700;padding:0 3px;border-radius:3px;margin-left:2px;vertical-align:2px;line-height:1.4}
.mut.祿{background:var(--good-soft);color:var(--good)}
.mut.權{background:var(--accent-soft);color:var(--accent)}
.mut.科{background:var(--hold-soft);color:var(--hold)}
.mut.忌{background:var(--seal-soft);color:var(--seal)}
.cell .minor{font-size:11.5px;color:var(--muted);line-height:1.4}
.cell .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:4px;padding-top:4px}
.cell .pname{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink)}
.cell .gz{font-size:11px;color:var(--muted)}
.cell .age{font-size:11px;color:var(--muted);font-family:var(--f-data)}
.cell .tags{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:0 4px;border-radius:3px;font-weight:700;line-height:1.5}
.tag.body{background:var(--ink);color:var(--panel)}
.tag.yr{background:var(--seal);color:var(--panel)}
.tag.dc{background:var(--hold);color:var(--panel)}
.center{grid-column:2/4;grid-row:2/4;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px 14px;text-align:center;font-size:13px;color:var(--muted)}
.center .nm{font-family:var(--f-display);font-size:18px;color:var(--ink);font-weight:700}
.center .kl{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
@media (max-width:520px){
  .zw{grid-template-rows:repeat(4,minmax(104px,auto));gap:3px}
  .cell{padding:4px 4px}
  .cell .stars{font-size:13px;gap:0 3px}
  .cell .minor{font-size:10px}
  .cell .pname{font-size:12.5px}
  .cell .gz,.cell .age{font-size:9.5px}
  .center{font-size:11.5px;padding:6px}
  .center .nm{font-size:15px}
}

footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.err{color:var(--seal);font-size:14px}
@media (prefers-reduced-motion:no-preference){ .detail,.card{transition:border-color .2s} }

html:lang(ja){--f-display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;--f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
html:lang(en),html:lang(fr){--f-display:"Source Serif 4",Georgia,"Times New Roman",serif;--f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cell .foot{flex-wrap:wrap}
.cell .gz,.cell .age{white-space:nowrap}
@media (max-width:520px){.cell .gz{display:none}}
.langs{display:flex;justify-content:flex-end;gap:2px;flex-wrap:wrap}
.langs button{font:inherit;font-size:13px;background:none;border:1px solid transparent;border-radius:999px;color:var(--muted);padding:3px 12px;cursor:pointer}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed="true"]{color:var(--accent);border-color:var(--line);background:var(--panel);font-weight:700}
.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.asplist{display:flex;flex-direction:column;gap:8px;font-size:14px}
.mutlist{display:flex;flex-direction:column;gap:3px;font-size:14px}
.cell .stars span{white-space:normal}
</style>
</head>
<body>
<div class="wrap">
  <div class="langs" role="group" aria-label="Language" id="langs"></div>

  <form class="birth" id="birth" novalidate>
    <div class="field"><label for="f-date" data-t="date"></label><input id="f-date" type="date" required min="1900-01-01" max="2100-12-31"></div>
    <div class="field"><label for="f-time" data-t="time"></label><input id="f-time" type="time" required></div>
    <div class="field"><span class="lab" data-t="gender"></span>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="g" id="f-g-f" value="女" checked><span data-t="female"></span></label>
        <label><input type="radio" name="g" id="f-g-m" value="男"><span data-t="male"></span></label>
      </div>
    </div>
    <div class="field"><label for="f-city" data-t="city"></label><select id="f-city"></select></div>
    <div class="field"><button class="go" type="submit" data-t="go"></button></div>
    <label class="check"><input type="checkbox" id="f-dst"><span data-t="dst"></span></label>
    <details class="adv"><summary data-t="adv"></summary>
      <div class="adv-grid">
        <div class="field"><label for="f-lat" data-t="lat"></label><input id="f-lat" type="number" step="0.01"></div>
        <div class="field"><label for="f-lon" data-t="lon"></label><input id="f-lon" type="number" step="0.01"></div>
        <div class="field"><label for="f-tz" data-t="tz"></label><input id="f-tz" type="number" step="0.5"></div>
      </div>
    </details>
  </form>
  <div class="notice" id="sample-note" data-t="sample"></div>
  <div class="err" id="err" hidden></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="t-west" aria-selected="true" aria-controls="p-west" data-t="tabW"></button>
    <button role="tab" id="t-zw" aria-selected="false" aria-controls="p-zw" data-t="tabZ"></button>
  </nav>

  <section class="pane" id="p-west" role="tabpanel" aria-labelledby="t-west">
    <div class="primer" id="w-primer"></div>
    <div class="sum" id="w-sum"></div>
    <div class="split">
      <div class="stage">
        <svg class="wheel" id="wheel" viewBox="0 0 540 540" role="img"></svg>
        <div class="legend"><span><i style="border-color:var(--good)"></i><span data-t="legGood"></span></span><span><i style="border-color:var(--seal)"></i><span data-t="legBad"></span></span><span><i style="border-color:var(--accent)"></i><span data-t="legConj"></span></span></div>
      </div>
      <aside class="detail" id="w-detail" aria-live="polite"></aside>
    </div>
    <h2 data-t="wTable"></h2>
    <div class="tablewrap"><table><thead><tr><th data-t="thP"></th><th data-t="thS"></th><th data-t="thH"></th><th data-t="thL"></th></tr></thead><tbody id="w-table"></tbody></table></div>
  </section>

  <section class="pane" id="p-zw" role="tabpanel" aria-labelledby="t-zw" hidden>
    <div class="primer" id="z-primer"></div>
    <div class="sum" id="z-sum"></div>
    <div class="split">
      <div class="stage"><div class="zw" id="zw"></div></div>
      <aside class="detail" id="z-detail" aria-live="polite"></aside>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iztro@2.6.1/dist/iztro.min.js"></script>
<script>
/* ===================== 語言資料 ===================== */
const ord=n=>n+((n%100>=11&&n%100<=13)?'th':(['th','st','nd','rd'][n%10]||'th'));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const SYM_P=['☉','☽','☿','♀','♂','♃','♄','♅','♆','♇'].map(c=>c+'︎');
const SYM_S=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'].map(c=>c+'︎');
const PINYIN_MAJOR=['Zi Wei','Tian Ji','Tai Yang','Wu Qu','Tian Tong','Lian Zhen','Tian Fu','Tai Yin','Tan Lang','Ju Men','Tian Xiang','Tian Liang','Qi Sha','Po Jun'];
const PINYIN_MINOR=['Zuo Fu','You Bi','Wen Chang','Wen Qu','Tian Kui','Tian Yue','Lu Cun','Tian Ma','Qing Yang','Tuo Luo','Huo Xing','Ling Xing','Di Kong','Di Jie'];

const I18N={
/* ---------- 中文 ---------- */
zh:{
 htmlLang:'zh-Hant', title:'Starlit 星曜',
 planets:[
  ['太陽','日','自我','你的核心自我','代表你是誰、想活成什麼樣子，也是你的活力來源。大家常說的「我是什麼座」就是指太陽星座。'],
  ['月亮','月','情緒','你的情緒與安全感','代表你需要什麼才覺得安心、心情怎麼起伏，也是你在家或私底下放鬆時的樣子。'],
  ['水星','水','思考','你的思考和說話方式','代表你怎麼想事情、怎麼學習、怎麼跟人溝通。'],
  ['金星','金','愛與喜好','你喜歡什麼、怎麼去愛','代表你的審美、享受方式，以及在感情裡被什麼吸引、怎麼表達好感。'],
  ['火星','火','行動力','你的行動力和脾氣','代表你怎麼爭取想要的東西、做事的衝勁，以及生氣時的樣子。'],
  ['木星','木','成長','你的好運與成長方向','代表你容易順利、願意相信、會越做越大的地方。'],
  ['土星','土','責任','你的壓力和人生功課','代表你覺得有責任、會害怕或卡住的地方。需要時間慢慢練，練成了就很穩。'],
  ['天王星','天','突破','你想突破的地方','代表你想與眾不同、打破常規的部分。它走得很慢，同年紀的人星座都差不多，所以宮位比星座更有個人意義。'],
  ['海王星','海','夢想','你的夢想與想像','代表理想、靈感，也代表容易看不清、想得太美的地方。它是世代星，宮位比星座更有個人意義。'],
  ['冥王星','冥','蛻變','你深層的執著與蛻變','代表你會非常執著、最後會徹底改變的地方。它是世代星，宮位比星座更有個人意義。']],
 signs:[
  ['牡羊座','羊','直接、搶第一、說做就做','熱血直接，想到就做，不喜歡等。缺點是急、沒耐性。'],

const MAJOR_KEYS=['紫微','天機','太陽','武曲','天同','廉貞','天府','太陰','貪狼','巨門','天相','天梁','七殺','破軍'];
const MINOR_KEYS=['左輔','右弼','文昌','文曲','天魁','天鉞','祿存','天馬','擎羊','陀羅','火星','鈴星','地空','地劫'];

/* ===================== 計算 ===================== */
const D2R=Math.PI/180,R2D=180/Math.PI,norm=x=>((x%360)+360)%360;
function westChart(utc,lat,lon){
  const A=Astronomy,t=A.MakeTime(utc);
  const Lo=(b,tt)=>b==='Moon'?A.EclipticGeoMoon(tt).lon:b==='Sun'?A.SunPosition(tt).elon:A.Ecliptic(A.GeoVector(b,tt,true)).elon;
  const pos={};
  for(const k of PK){const l=Lo(k,t);let d=norm(l-Lo(k,t.AddDays(-0.5)));if(d>180)d-=360;pos[k]={lon:l,retro:d<0};}
  const ramc=norm(A.SiderealTime(t)*15+lon);
  const e=(23.4392911-0.0130042*(t.tt/36525))*D2R,ra=ramc*D2R,ph=lat*D2R;
  const mc=norm(Math.atan2(Math.sin(ra),Math.cos(ra)*Math.cos(e))*R2D);
  const asc=norm(Math.atan2(Math.cos(ra),-(Math.sin(ra)*Math.cos(e)+Math.tan(ph)*Math.sin(e)))*R2D);
  function cusp(f,off,above){let r=ramc+off,lam;
    for(let i=0;i<60;i++){lam=norm(Math.atan2(Math.sin(r*D2R),Math.cos(r*D2R)*Math.cos(e))*R2D);
      const dec=Math.asin(Math.sin(e)*Math.sin(lam*D2R)),x=Math.tan(ph)*Math.tan(dec);
      if(Math.abs(x)>1)return null;const ad=Math.asin(x)*R2D;
      const rn=above?ramc+f*(90+ad):ramc+180-f*(90-ad);
      if(Math.abs(norm(rn-r+180)-180)<1e-7)break;r=rn;}
    return lam;}
  const c11=cusp(1/3,30,true),c12=cusp(2/3,60,true),c2=cusp(2/3,120,false),c3=cusp(1/3,150,false);
  let houses;
  if([c11,c12,c2,c3].some(v=>v==null))houses=[...Array(12)].map((_,i)=>norm(asc+30*i));
  else houses=[asc,c2,c3,norm(mc+180),norm(c11+180),norm(c12+180),norm(asc+180),norm(c2+180),norm(c3+180),mc,c11,c12];
  for(const k of PK)pos[k].house=houseOf(pos[k].lon,houses);
  const asp=[];
  for(let i=0;i<PK.length;i++)for(let j=i+1;j<PK.length;j++){
    const a=PK[i],b=PK[j];let d=Math.abs(pos[a].lon-pos[b].lon);if(d>180)d=360-d;
    const lum=(a==='Sun'||a==='Moon'||b==='Sun'||b==='Moon')?2:0;
    for(let s=0;s<ASPECTS.length;s++){const o=Math.abs(d-ASPECTS[s].a);if(o<=ASPECTS[s].orb+lum){asp.push({a,b,t:s,tone:ASPECTS[s].tone,deg:ASPECTS[s].a,orb:o});break;}}
  }
  asp.sort((x,y)=>x.orb-y.orb);
  return {pos,asc,mc,houses,asp};
}
function houseOf(l,h){for(let i=0;i<12;i++){const a=h[i],b=h[(i+1)%12];if(norm(l-a)<norm(b-a))return i+1;}return 1;}
const signOf=l=>Math.floor(norm(l)/30);
const fmtDeg=l=>{const x=norm(l)%30;const d=Math.floor(x),m=Math.floor((x-d)*60);return `${d}°${String(m).padStart(2,'0')}′`;};

let errKey=null;

function compute(v){
  showErr(null);
  if(!v.date||!v.time){showErr('errTime');return false;}
  if([v.lat,v.lon,v.tz].some(isNaN)){showErr('errPlace');return false;}
  const [y,m,d]=v.date.split('-').map(Number),[hh,mm]=v.time.split(':').map(Number);
  const stdMs=Date.UTC(y,m-1,d,hh,mm)-(v.dst?3600e3:0);
  W=westChart(new Date(stdMs-v.tz*3600e3),v.lat,v.lon);
  const sd=new Date(stdMs),sh=sd.getUTCHours();
  const ti=sh===23?12:Math.floor((sh+1)/2);
  Z=iztro.astro.bySolar(`${sd.getUTCFullYear()}-${sd.getUTCMonth()+1}-${sd.getUTCDate()}`,ti,v.g,true,'zh-TW');
  try{ZH=Z.horoscope(new Date());}catch(e){ZH=null;}
  Z._ti=ti;Z._std=sd;
  selZ=Z.palaces.findIndex(p=>p.name==='命宮');
  return true;
}

const C=270;
function xy(l,r){const th=(180+(l-W.asc))*D2R;return[C+r*Math.cos(th),C-r*Math.sin(th)];}
function arc(l1,l2,r1,r2){const[a,b]=xy(l1,r2),[c,d]=xy(l2,r2),[e,f]=xy(l2,r1),[g,h]=xy(l1,r1);
  return `M${a},${b} A${r2},${r2} 0 0 0 ${c},${d} L${e},${f} A${r1},${r1} 0 0 1 ${g},${h}Z`;}
function drawWheel(){
  const svg=$('#wheel');svg.setAttribute('aria-label',L.ui.wheelAria);const R0=262,R1=226,R2=112,RP=184;let s='';
  for(let i=0;i<12;i++){const g=sg(i),l=i*30;s+=`<path d="${arc(l,l+30,R1,R0)}" fill="var(--${g.el})" fill-opacity="${i%2?0.10:0.17}" stroke="var(--line)"/>`;
    const[x,y]=xy(l+15,(R0+R1)/2);s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="var(--${g.el})">${g.glyph}</text>`;}
  s+=`<circle cx="${C}" cy="${C}" r="${R1}" fill="none" stroke="var(--line)"/><circle cx="${C}" cy="${C}" r="${R2}" fill="var(--sunk)" stroke="var(--line)"/>`;
  for(let d=0;d<360;d+=5){if(d%30===0)continue;const[a,b]=xy(d,R1),[c,e]=xy(d,R1-(d%10===0?7:4));s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="var(--muted)" stroke-opacity=".5"/>`;}
  W.houses.forEach((h,i)=>{const ang=i===0||i===9;const[a,b]=xy(h,R2),[c,d]=xy(h,ang?R0+4:R1);
    s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${ang?'var(--ink)':'var(--line)'}" stroke-width="${ang?2:1}"/>`;
    const mid=h+norm(W.houses[(i+1)%12]-h)/2;const[x,y]=xy(mid,R2+14);s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--muted)" class="mono">${i+1}</text>`;});
  {const[x,y]=xy(W.asc,R0-10);s+=`<text x="${x+2}" y="${y-10}" font-size="11" font-weight="700" fill="var(--ink)">${L.ui.ascL}</text>`;
   const[mx,my]=xy(W.mc,R0-6);s+=`<text x="${mx+6}" y="${my+4}" font-size="11" font-weight="700" fill="var(--ink)">${L.ui.mcL}</text>`;}
  for(const a of W.asp){if(a.deg===0)continue;const[x1,y1]=xy(W.pos[a.a].lon,R2-4),[x2,y2]=xy(W.pos[a.b].lon,R2-4);
    const col=a.tone==='good'?'var(--good)':'var(--seal)';const on=a.a===selW||a.b===selW;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${on?2:1.2}" stroke-opacity="${on?0.95:0.15}"/>`;}
  const arr=PK.map(k=>({k,l:W.pos[k].lon,d:W.pos[k].lon}));arr.sort((a,b)=>a.l-b.l);
  for(let it=0;it<40;it++){let moved=false;for(let i=0;i<arr.length;i++){const a=arr[i],b=arr[(i+1)%arr.length];const df=norm(b.d-a.d);if(df<10){a.d-=(10-df)/2;b.d+=(10-df)/2;moved=true;}}if(!moved)break;}
  for(const o of arr){const p=pl(o.k);const[t1,t2]=xy(o.l,R1),[t3,t4]=xy(o.l,R1-10),[cx,cy]=xy(o.d,RP),[l3,l4]=xy(o.d,RP+15);
    s+=`<line x1="${t1}" y1="${t2}" x2="${t3}" y2="${t4}" stroke="var(--ink)" stroke-width="2"/><line x1="${t3}" y1="${t4}" x2="${l3}" y2="${l4}" stroke="var(--muted)" stroke-opacity=".5"/>`;
    s+=`<g class="pl${selW===o.k?' on':''}" data-k="${o.k}" tabindex="0" role="button" aria-label="${p.name}"><circle class="bg" cx="${cx}" cy="${cy}" r="15"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central">${p.glyph}</text>${W.pos[o.k].retro?`<text x="${cx+13}" y="${cy+12}" font-size="9" style="font-family:var(--f-body);font-weight:700;fill:var(--seal)">R</text>`:''}</g>`;}
  svg.innerHTML=s;
  svg.querySelectorAll('.pl').forEach(g=>{const f=()=>{selW=g.dataset.k;drawWheel();showPlanet();};g.addEventListener('click',f);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}});});
}
function showPlanet(){
  const k=selW,p=pl(k),q=W.pos[k],g=sg(signOf(q.lon)),U=L.ui,F=L.fn;

  <div class="block"><h4>${F.secPlanet(p.name)}</h4><p>${p.long}</p></div>

  ${q.retro?`<div class="block"><h4>${U.secRetro}</h4><p>${U.retroTxt}</p></div>`:''}
  <div class="block"><h4>${U.secAsp}</h4>${asp.length?`<div class="asplist">${asp.map(a=>{const o=pl(a.a===k?a.b:a.a);const[n,say]=L.aspects[a.t];return `<div><span class="chip ${a.tone==='good'?'good':a.tone==='bad'?'bad':'acc'}">${n}</span> ${F.aspLine(o.name,say,p.theme,o.theme)}</div>`;}).join('')}</div>`:`<p class="muted">${U.noAsp}</p>`}</div>`;

  <p class="say">${d} ${lead}</p>
  <div class="chips">${p.isBodyPalace?`<span class="chip acc">${U.bodyHere}</span>`:''}${dec?`<span class="chip hold">${U.decNow}</span>`:''}${yr?`<span class="chip bad">${U.yrNow}</span>`:''}<span class="chip mono">${F.decAges(p.decadal.range.join('–'))}</span></div>
  ${p.isBodyPalace?`<div class="block"><h4>${U.secBody}</h4><p>${F.bodyTxt(d)}</p></div>`:''}
  ${dec?`<div class="block"><h4>${U.decNow}</h4><p>${F.decTxt(p.decadal.range[0],p.decadal.range[1],d,decMuts())}</p></div>`:''}
  ${yr?`<div class="block"><h4>${F.yrHead(ZH.yearly.heavenlyStem+ZH.yearly.earthlyBranch)}</h4><p>${F.yrTxt(d)}</p></div>`:''}
  ${(p.majorStars.length?'':`<p class="hint">${F.borrowed(palName(opp.name))}</p>`)+stars.map(majorBlock).join('')}
  ${minor.length?`<div class="block"><h4>${U.otherStars}</h4>${minor.map(s=>`<p><b>${starName(s.name)}</b>${s.mutagen?` <span class="mut ${s.mutagen}">${mutOf(s.mutagen)[1]}</span>`:''}：${L.minor[MINOR_KEYS.indexOf(s.name)][1]}</p>`).join('')}</div>`:''}`;
}
function zwSummary(){
  const U=L.ui,F=L.fn,ming=Z.palaces.find(p=>p.name==='命宮'),body=Z.palaces.find(p=>p.isBodyPalace);
  const mi=Z.palaces.indexOf(ming),opp=Z.palaces[(mi+6)%12];
  const src=ming.majorStars.length?ming.majorStars:opp.majorStars;
  const ms=ming.majorStars.length?src.map(s=>starName(s.name)).join('・'):`${U.empty}（${src.map(s=>starName(s.name)).join('・')||'—'}）`;
  const msDesc=src.map(s=>L.major[MAJOR_KEYS.indexOf(s.name)][2]).join(' ');
  const dec=ZH?Z.palaces[ZH.decadal.index]:null,yr=ZH?Z.palaces[ZH.yearly.index]:null;
  const mlist=[];Z.palaces.forEach(p=>[...p.majorStars,...p.minorStars].forEach(s=>{if(s.mutagen)mlist.push({m:s.mutagen,s:starName(s.name),p:palName(p.name)});}));
  mlist.sort((a,b)=>MUT_KEYS.indexOf(a.m)-MUT_KEYS.indexOf(b.m));
  const same=body.name==='命宮';
  $('#z-sum').innerHTML=`
  <div class="card"><span class="q">${U.zCardMing}</span><span class="big">${ms}</span><p>${msDesc}</p></div>
  <div class="card"><span class="q">${U.zCardBody}</span><span class="big">${same?U.sameBody:palName(body.name)}</span><p>${same?U.sameBodyTxt:F.bodyCard(palDesc(body.name))}</p></div>
  ${dec?`<div class="card"><span class="q">${F.zCardDec(dec.decadal.range.join('–'))}</span><span class="big">${palName(dec.name)}</span><p>${F.decCard(palDesc(dec.name),palName(yr.name))}</p></div>`:''}
  <div class="card"><span class="q">${U.zCardMut}</span><div class="mutlist">${mlist.map(x=>`<div>${mutBadge(x.m)} ${F.mutWhere(x.s,x.p)}</div>`).join('')}</div></div>`;
}

/* ===================== 語言切換 ===================== */
function primer(id,arr){$(id).innerHTML=arr.map(([b,t])=>`<div><b>${b}</b><span>${t??L.mut.map((m,j)=>`${mutBadge(MUT_KEYS[j])} ${m[3]}`).join('　')}</span></div>`).join('');}
function applyLang(lg){
  LG=I18N[lg]?lg:'zh';L=I18N[LG];
  document.documentElement.lang=L.htmlLang;document.title=L.title;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=L.ui[el.dataset.t];});
  const cur=$('#f-city').value;fillCities();if(cur)$('#f-city').value=cur;
  primer('#w-primer',L.ui.wPrimer);primer('#z-primer',L.ui.zPrimer);
  $('#langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LG));
  if(errKey)showErr(errKey);
  if(W&&Z)renderAll();
  try{localStorage.setItem('starlit-lang',LG);}catch(e){}
}

/* ===================== 啟動 ===================== */
function renderAll(){drawWheel();showPlanet();westSummary();westTable();drawZW();showPalace();zwSummary();}
function store(v){try{localStorage.setItem('kdwp-birth',JSON.stringify(v));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('kdwp-birth')||'null');}catch(e){return null;}}
function tab(which){const w=which==='west';$('#t-west').setAttribute('aria-selected',w);$('#t-zw').setAttribute('aria-selected',!w);$('#p-west').hidden=!w;$('#p-zw').hidden=w;try{localStorage.setItem('kdwp-tab',which);}catch(e){}}

function boot(){
  const names={zh:'中文',en:'English',ja:'日本語',fr:'Français'};
  $('#langs').innerHTML=Object.keys(names).map(k=>`<button type="button" data-l="${k}" lang="${I18N[k].htmlLang}">${names[k]}</button>`).join('');
  $('#langs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.l)));
  let lg=null;try{lg=localStorage.getItem('starlit-lang');}catch(e){}
  if(!lg){const n=(navigator.language||'zh').toLowerCase();lg=n.startsWith('ja')?'ja':n.startsWith('fr')?'fr':n.startsWith('zh')?'zh':'en';}
  LG=I18N[lg]?lg:'zh';L=I18N[LG];
  fillCities();
  $('#f-city').addEventListener('change',onCity);
  if(typeof Astronomy==='undefined'||typeof iztro==='undefined'){applyLang(LG);showErr('errLib');return;}
  const saved=load();setForm(saved||SAMPLE);$('#sample-note').hidden=!!saved;
  compute(readForm());
  applyLang(LG);
  $('#birth').addEventListener('submit',e=>{e.preventDefault();const v=readForm();if(compute(v)){store(v);$('#sample-note').hidden=true;selW='Sun';renderAll();}});
  $('#t-west').addEventListener('click',()=>tab('west'));$('#t-zw').addEventListener('click',()=>tab('zw'));
  let t=null;try{t=localStorage.getItem('kdwp-tab');}catch(e){} if(t==='zw')tab('zw');
}
boot();
</script>
